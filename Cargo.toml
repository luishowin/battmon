[package]
name = "battmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Battery monitor for GNOME: level history, health, cycles and charge rate"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
jiff = "1.0.1"
rusqlite = "0.43.0"
signal-hook = "0.4.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
