[package]
name = "battmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Battery monitor for GNOME: level history, health, cycles and charge rate"
license = "MIT"
readme = "README.md"
repository = "https://github.com/luishowin/battmon"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[[bin]]
name = "battmon"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10"], optional = true }
anyhow = "1.0.104"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_24"], optional = true }
jiff = "1.0.1"
rusqlite = "0.43.0"
signal-hook = "0.4.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
